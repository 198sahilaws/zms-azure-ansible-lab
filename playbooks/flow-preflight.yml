---
# flow-preflight.yml - imported at the top of every flow-test playbook. Not run on its own.
# Stops the run while a converge or reconverge holds the run lock (probing hosts mid-change
# gives false failures), fixes one run ID for the log, and prints the phase.

- name: Flow tests | pre-flight
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - ../vars/flows.yml
  vars:
    flow_lock_file: >-
      {{ lookup('ansible.builtin.env', 'CONTROL_REPO_DIR') | default('/opt/control-repo', true) }}/.git/zms-ansible.lock
  tasks:
    # flock exits 75 only when another process holds the lock; any other non-zero exit is an
    # error (for example a lock file this user cannot open), reported separately below.
    - name: Check whether a converge or reconverge holds the run lock
      ansible.builtin.command:
        argv: [flock, --nonblock, --conflict-exit-code, "75", "{{ flow_lock_file }}", "true"]
      register: flow_lock_probe
      changed_when: false
      failed_when: false
      when: not (flow_ignore_lock | default(false) | bool)

    - name: Fix the run ID and record the lock state
      ansible.builtin.set_fact:
        flow_run_id_fixed: "{{ flow_run_id | default(now(fmt='%Y%m%dT%H%M%S')) }}"
        flow_lock_held: "{{ flow_lock_probe is not skipped and flow_lock_probe.rc == 75 }}"

    - name: Stop if the run lock cannot be checked
      ansible.builtin.fail:
        msg: >-
          Cannot check the run lock {{ flow_lock_file }} (flock rc={{ flow_lock_probe.rc }}):
          {{ flow_lock_probe.stderr | default('') }}. Check its owner and mode with ls -l; it should
          belong to the service user (ubuntu).
      when:
        - flow_lock_probe is not skipped
        - flow_lock_probe.rc not in [0, 75]

    - name: Stop while a converge is running
      ansible.builtin.fail:
        msg: >-
          A converge or reconverge holds {{ flow_lock_file }}. Wait for it to finish
          (systemctl is-active ansible-estate.service ansible-bootstrap.service), then run again.
          scripts/flow-test.sh waits for it automatically.
      when: flow_lock_held | bool

    - name: Validate the settings
      ansible.builtin.assert:
        that:
          - flow_phase | default('', true) in ['', 'learn', 'verify']
          - flow_mode in ['positive', 'negative', 'all']
          - flow_rounds | int >= 1
          - flow_timeout | int >= 1
        fail_msg: >-
          Invalid setting: flow_phase must be learn or verify (got '{{ flow_phase }}'), flow_mode
          positive, negative or all (got '{{ flow_mode }}'), flow_rounds and flow_timeout at least 1.
        quiet: true

    # A broken inventory (for example missing Azure SDK packages) leaves only the implicit
    # localhost. Without this check every play is skipped and the run reports ok with 0 probes.
    - name: Stop if the inventory is empty
      ansible.builtin.assert:
        that: groups['all'] | length > 0
        fail_msg: >-
          The inventory has no hosts, so there is nothing to test. Check the inventory warnings at
          the top of this output and run: sudo /opt/control-repo/scripts/estate-shell.sh ansible-inventory --graph
        quiet: true

    - name: Phase
      ansible.builtin.debug:
        msg: >-
          run={{ flow_run_id_fixed }} phase={{ flow_phase | default('', true) or 'standalone' }}
          mode={{ flow_mode }} enforced={{ flow_enforced | bool }} rounds={{ flow_rounds }}
