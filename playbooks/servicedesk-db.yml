---
# Prepare the database host for the service desk.
#
#   ansible-playbook playbooks/servicedesk-db.yml
#   ansible-playbook playbooks/servicedesk-db.yml -e target=10.191.10.20
#
# Creates the `servicedesk` database, the application account and the server
# drop-in (bind-address, skip-name-resolve). The TABLES are created by
# servicedesk-middleware.yml, which has the venv and schema.sql.
#
# Run before servicedesk-middleware.yml. The application account accepts
# connections from ANY host ('%'): access between hosts is enforced only by
# ZMS microsegmentation, not by NSGs or MySQL host patterns — see
# sd_db_client_pattern below.

- name: Prepare the service desk database host
  # Role AND distro intersection — role_db spans every distro in the estate, so
  # a bare role group would try to prepare the SLES and RHEL MariaDB hosts too.
  hosts: "{{ target | default(sd_db_group ~ ':&' ~ sd_db_distro_group) }}"
  gather_facts: true
  vars_files:
    - ../vars/servicedesk.yml
  vars:
    # Credentials resolved FIELD-SCOPED and inline (see group_vars/all.yml). Two
    # separate lookups rather than one bound `secret` dict on purpose: binding
    # the whole document would put the SSH private key and every other password
    # in scope for this play, where one -vvv leaks all of them.
    sd_mysql_root_password: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).mysql_root_password | default('', true) }}
    # The dedicated app password. modules/secrets writes this key from
    # servicedesk_db_password, so it exists in every estate built from this
    # repo's Terraform — but it defaults to "" there, and an unset key resolves
    # to '' here rather than erroring. Empty therefore means "operator did not
    # set it", not "old estate", and we fall back to the root password with a
    # warning below. The account is still NOT root even then (its grant is
    # servicedesk.* only), but it can authenticate AS root, which is the part
    # worth being noisy about.
    sd_db_password_from_secret: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).servicedesk_db_password | default('', true) }}
  pre_tasks:
    - name: Skip hosts that are not part of the Debian/RedHat/Suse families we handle
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] not in ['Debian', 'RedHat', 'Suse']

    # Same rule as servicedesk-web.yml: an estate with NO middleware host is not
    # running the service desk, so leave its database alone rather than create
    # an sdapp account with a guessed grant. An estate that has the group but
    # no matching host fails below, with the reason.
    - name: Skip estates that do not run the service desk
      ansible.builtin.meta: end_host
      when: (groups[sd_middleware_group] | default([])) | length == 0

    - name: Assert a database password is available
      ansible.builtin.assert:
        that:
          - (sd_db_password_from_secret | length > 0) or (sd_mysql_root_password | length > 0)
        fail_msg: >-
          Neither servicedesk_db_password nor mysql_root_password is set in the
          consolidated secret. Set servicedesk_db_password (and
          mysql_root_password) in secrets.auto.tfvars (deployments/web-app or
          deployments/multi-environment-ring-fencing) and re-apply, then
          converge again.
      no_log: true

    # Not a secret, so outside the no_log below: when it is empty the reason has
    # to be visible.
    - name: Resolve the middleware host this database serves
      ansible.builtin.set_fact:
        sd_db_middleware_host: >-
          {{ (groups[sd_middleware_group] | default([]))
             | intersect(groups[sd_middleware_distro_group] | default([]))
             | intersect(sd_ring_peers)
             | first | default('', true) }}

    - name: Fail when no middleware host matches this database host
      # Previously this fell back to granting '10.0.0.%', which can be a real
      # subnet (a VNet's public tier). No guessed grant: say what is missing.
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} would serve the service desk, but no host is in
          both '{{ sd_middleware_group }}' and '{{ sd_middleware_distro_group }}'
          {{ ('within ring ' ~ sd_ring_group) if sd_ring_group | length > 0 else '' }}.
          Check the Role/Distro (and AppEnv) tags with `ansible-inventory --graph`,
          or pass -e target=... to limit this play.
      when: sd_db_middleware_host | length == 0

    - name: Resolve the effective application password and client pattern
      ansible.builtin.set_fact:
        sd_db_password: "{{ sd_db_password_from_secret if sd_db_password_from_secret | length > 0 else sd_mysql_root_password }}"
        # A boolean, not a credential, so the warning task below can run outside
        # no_log and actually be visible in the converge output.
        sd_db_password_is_root: "{{ sd_db_password_from_secret | length == 0 }}"
        # Any host ('%'), by design since 2026-11-03: policy between hosts
        # is enforced ONLY by ZMS microsegmentation. Until then the account
        # was scoped to the middleware host's own /24, which kept each ring's
        # data to its own middleware even with the ring NSGs open; that was a
        # second enforcement point outside ZMS, so it is gone. The password is
        # still required, and the account still holds servicedesk.* only.
        #
        # Converging an estate built with the /24 grant drops that account
        # ("Remove the superseded accounts" in roles/servicedesk_db), so the
        # middleware keeps working through the '%' account.
        #
        # sd_db_middleware_host above is still resolved within this ring, so a
        # database with no middleware in its ring still fails loudly instead of
        # serving nothing.
        sd_db_client_pattern: "%"
      no_log: true

    - name: Warn when the app account is being given the MySQL root password
      # Loud on purpose, and a warning rather than a failure: the lab must still
      # converge for an operator who has not set the new variable yet. But this
      # is a real weakening — 'sdapp' keeps its servicedesk.*-only grant, so it
      # cannot do more THROUGH that account, while anyone who reads
      # /etc/servicedesk/servicedesk.env on the middleware host now holds a
      # credential that also authenticates as root@localhost on the db host.
      ansible.builtin.debug:
        msg: >-
          WARNING: servicedesk_db_password is empty in the consolidated secret, so
          '{{ sd_db_user }}' is being created with the MySQL ROOT password. Set
          servicedesk_db_password in secrets.auto.tfvars and re-apply to split
          them. The role will rotate the account's password on the next converge.
      when: sd_db_password_is_root | bool

    - name: Show which hosts the grant will admit
      # Deliberately outside the no_log above: the pattern is not a secret and
      # it is the single most useful thing to see when the middleware cannot
      # connect.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: granting '{{ sd_db_user }}'@'{{ sd_db_client_pattern }}'
          (any host; access policy is left to ZMS), serving middleware
          {{ sd_db_middleware_host }}
          {{ '(ring ' ~ sd_ring_group ~ ')' if sd_ring_group | length > 0 else '(single-ring estate)' }}
  roles:
    - servicedesk_db
