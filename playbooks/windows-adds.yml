---
# Promote a Windows Server to the FIRST domain controller of a NEW forest.
# Root domain: ad_domain_name from inventory/group_vars/os_windows.yml -- the
# ADDomain tag Terraform sets (deployments/adds, deployments/web-app-adds),
# else alcor.co.in.
#
#   ansible-playbook playbooks/windows-adds.yml
#   ansible-playbook playbooks/windows-adds.yml --limit win-dc01
#   ansible-playbook playbooks/windows-adds.yml -e target=role_dc
#
# The DSRM (Directory Services Restore Mode / "safe mode") password is fetched
# from the estate's Azure Key Vault at run time — never stored in Git. The module marks
# safe_mode_password as no_log automatically.

- name: Build a new AD forest
  hosts: "{{ target | default('role_dc') }}"
  ignore_unreachable: true   # a down/unsynced Windows host must not abort the converge
  gather_facts: true
  vars:
    # DSRM / safe-mode password from the single consolidated secret, key
    # dsrm_password. Resolved field-scoped inline (see group_vars/all.yml note).
    dsrm_password: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).dsrm_password | default('', true) }}
    # Optional dedicated domain-join account (secret keys domain_join_username /
    # domain_join_password), created at the end of this play. See the note there.
    domain_join_user_secret: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).domain_join_username | default('', true) }}
    domain_join_password_secret: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).domain_join_password | default('', true) }}
    # The account name in this forest: "zsroot", "SAFEMARCH\zsroot" and "zsroot@safemarch.local"
    # all give zsroot. An account of another domain gives '' (it cannot be created here).
    domain_join_account: >-
      {%- set u = domain_join_user_secret | trim -%}
      {%- if ad_backslash in u -%}
      {%-   set parts = u.split(ad_backslash, 1) -%}
      {{ parts[1] if (parts[0] | upper) == (ad_domain_netbios | upper) else '' }}
      {%- elif '@' in u -%}
      {%-   set parts = u.split('@', 1) -%}
      {{ parts[0] if (parts[1] | lower) == (ad_domain_name | lower) else '' }}
      {%- else -%}
      {{ u }}
      {%- endif -%}
  tasks:
    - name: Skip hosts that could not be reached (no facts gathered = unreachable)
      ansible.builtin.meta: end_host
      when: ansible_facts | length == 0

    - name: Assert the DSRM password is present in the consolidated secret
      ansible.builtin.assert:
        that:
          - dsrm_password | length > 0
        fail_msg: >-
          dsrm_password is empty. Set dsrm_password in secrets.auto.tfvars so it
          is written to the consolidated secret before promoting the forest.
      no_log: true

    - name: Install AD DS role and management tools
      ansible.windows.win_feature:
        name: AD-Domain-Services
        include_management_tools: true
        state: present
      register: ad_feature

    - name: Reboot if the feature install requires it
      ansible.windows.win_reboot:
      when: ad_feature.reboot_required

    - name: Promote host to first DC of new forest {{ ad_domain_name }}
      microsoft.ad.domain:
        dns_domain_name: "{{ ad_domain_name }}"
        domain_netbios_name: "{{ ad_domain_netbios }}"
        safe_mode_password: "{{ dsrm_password }}"
        install_dns: true
        reboot: true          # module manages the post-promotion reboot
      register: forest

    - name: Wait for AD Web Services to come up (DC is ready)
      ansible.windows.win_service:
        name: ADWS
        state: started
        start_mode: auto
      register: adws
      until: adws is succeeded
      retries: 30
      delay: 20

    - name: Forward non-AD DNS queries to Azure DNS
      ansible.builtin.include_tasks: tasks/azure-dns-forwarder.yml

    # WHY THIS EXISTS
    # Promoting the FIRST DC of a new forest migrates the server's local SAM
    # accounts into the new directory, so local 'zmsadmin' becomes SAFEMARCH\zmsadmin.
    # But membership of the LOCAL Administrators group does NOT carry over into
    # Domain Admins - the migrated account lands as an ordinary domain user that
    # happens to sit in BUILTIN\Administrators on this DC.
    #
    # That is enough for most things, which is why this went unnoticed:
    #   - WinRM management of the DC          -> works (BUILTIN\Administrators)
    #   - joining a member server to the domain -> works (any authenticated user
    #     may join up to ms-DS-MachineAccountQuota = 10 computers)
    #   - promoting a READ-ONLY DC            -> FAILS, because
    #     Install-ADDSDomainController explicitly verifies Domain Admins or
    #     Enterprise Admins membership and refuses otherwise:
    #       "Verification of user credential permissions failed. You have not
    #        supplied user credentials that belong to the Domain Admins group
    #        or the Enterprise Admins group."
    #
    # So windows-rodc.yml can never succeed unless this runs first. It is placed
    # here (not in windows-rodc.yml) because it must happen on the forest root
    # DC, and because orchestrate.yml runs windows-adds.yml before windows-rodc.yml.
    #
    # This works without any additional credentials because BUILTIN\Administrators
    # on a DC may modify group membership - the account elevates itself once.
    # Idempotent: re-running is a no-op when the account is already a member.
    - name: Ensure the Ansible account is a Domain Admin (required to promote RODCs)
      microsoft.ad.group:
        name: Domain Admins
        scope: global
        state: present
        members:
          add:
            - "{{ ansible_user | regex_replace('^.*[\\\\]', '') }}"
      register: da_member
      until: da_member is succeeded
      retries: 5
      delay: 15

    # Enterprise Admins exists only in the FOREST ROOT domain, which is what this
    # play creates. Needed for forest-wide operations such as adprep/rodcprep,
    # which RODC promotion triggers on first use.
    - name: Ensure the Ansible account is an Enterprise Admin (forest-wide operations)
      microsoft.ad.group:
        name: Enterprise Admins
        scope: universal
        state: present
        members:
          add:
            - "{{ ansible_user | regex_replace('^.*[\\\\]', '') }}"
      register: ea_member
      until: ea_member is succeeded
      retries: 5
      delay: 15

    # Group membership is only re-evaluated when a new token is issued, so the
    # elevation above does not affect the CURRENT WinRM session. Dropping the
    # connection forces the next task (and windows-rodc.yml) to authenticate
    # afresh and pick up the new privileges.
    - name: Reset the connection so the new group membership takes effect
      ansible.builtin.meta: reset_connection

    # THE NAMED DOMAIN-JOIN ACCOUNT
    # domain_join_username in secrets.auto.tfvars may name a dedicated account for the domain
    # joins and the ADC/RODC promotions (windows-domain-join.yml, windows-adc.yml,
    # windows-rodc.yml). Nothing else creates it: without this step those plays fail with
    # "The user name or password is incorrect" after five retries, and the DC logs 0xC0000064
    # (no such user). So it is created here, in the forest root, with domain_join_password and
    # the two groups the admin account gets above: Domain Admins to promote a DC, Enterprise
    # Admins for the forest preparation the first RODC triggers.
    #
    # Skipped when domain_join_username is empty (the admin account is used) or names the admin
    # account itself (it already exists; the join plays check its password). update_password:
    # on_create never overwrites the password of an account that already exists. Runs after the
    # connection reset, so with the Domain Admin rights granted above. The output is hidden
    # because it carries the password; to see an error, re-run with -e adds_no_log=false.
    - name: Require a password for the named domain-join account
      ansible.builtin.assert:
        that: domain_join_password_secret | length > 0
        fail_msg: >-
          domain_join_username is set to '{{ domain_join_user_secret }}' but domain_join_password
          is empty. Set both in secrets.auto.tfvars (or leave both empty to use the admin account),
          then terraform apply to update the secret.
        quiet: true
      when: domain_join_account | length > 0

    - name: Note a domain-join account from another domain (not created)
      ansible.builtin.debug:
        msg: >-
          domain_join_username '{{ domain_join_user_secret }}' belongs to another domain, so it is
          not created here. That domain must already trust {{ ad_domain_name }} and hold the account.
      when:
        - domain_join_user_secret | length > 0
        - domain_join_account | length == 0

    - name: Create the named domain-join account and make it a Domain and Enterprise Admin
      microsoft.ad.user:
        name: "{{ domain_join_account }}"
        password: "{{ domain_join_password_secret }}"
        update_password: on_create
        password_never_expires: true
        enabled: true
        state: present
        groups:
          add:
            - Domain Admins
            - Enterprise Admins
      when:
        - domain_join_account | length > 0
        - (domain_join_account | lower) != (ansible_user | regex_replace('^.*[\\\\]', '') | lower)
      register: join_account
      until: join_account is succeeded
      retries: 5
      delay: 15
      no_log: "{{ adds_no_log | default(true) | bool }}"
