---
# flow-internet.yml - HTTPS from each host to the sites in vars/flows.yml (flow_internet_sites).
# Manual use only.
#
#   F10  web, middleware, db, control node, DCs -> each site, expected to connect
#   The client (Intranet Users) is not tested: it is not an F10 source in Table 5, and its
#   internet access is not a denied flow either.
#
# Each probe is a TLS handshake and one GET (no redirects followed: cnn.com -> www.cnn.com is
# reported, not fetched). ip.zscaler.com is also parsed to show whether the traffic went
# through Zscaler and the egress IP.
#
# Usage (on the control node):
#   sudo /opt/control-repo/scripts/estate-shell.sh ansible-playbook playbooks/flow-internet.yml
#   ... -e flow_validate_certs=false (ZIA SSL inspection without the Zscaler root CA)

- name: Pre-flight
  ansible.builtin.import_playbook: flow-preflight.yml

- name: Flow tests | internet sites
  hosts: "{{ target | default(flow_all_pattern ~ ':!role_client') }}"
  gather_facts: false
  vars_files:
    - ../vars/flows.yml
  vars:
    flow_playbook_name: flow-internet
    flow_self_label: >-
      {{ group_names | select('match', '^role_') | map('regex_replace', '^role_', '') | first | default('host') }}
    # All of these are allowed flows, so a negative-only run (-e flow_mode=negative) sends nothing.
    flow_wanted: "{{ {'positive': ['allow'], 'negative': ['deny'], 'all': ['allow', 'deny']}[flow_mode] }}"
  tasks:
    - name: End here if pre-flight found the converge lock held
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['flow_lock_held'] | default(false) | bool

    - name: Build this host's probe plan
      ansible.builtin.set_fact:
        flow_plan: >-
          {%- set out = [] -%}
          {%- if 'allow' in flow_wanted and 'role_client' not in group_names -%}
          {%-   for url in flow_internet_sites -%}
          {%-     set _ = out.append({'flow': 'F10',
                    'target': url | urlsplit('hostname'), 'url': url, 'probe': 'https',
                    'verify': flow_validate_certs | bool, 'zscaler': 'ip.zscaler.com' in url,
                    'expect': 'allow'}) -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ out }}

    - name: Run the probes
      ansible.builtin.include_tasks: tasks/flow-run.yml

- name: Report
  ansible.builtin.import_playbook: flow-report.yml
