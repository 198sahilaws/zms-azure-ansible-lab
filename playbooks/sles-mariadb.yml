---
# Install MariaDB (MySQL-compatible) on SLES database servers.
#
#   ansible-playbook playbooks/sles-mariadb.yml
#   ansible-playbook playbooks/sles-mariadb.yml --limit 10.188.10.51
#
# SLES 15 ships MariaDB in the base product (package + service both 'mariadb'),
# so no external vendor repo is required — the same supply-chain principle as
# rhel-mariadb.yml.

- name: Install and enable MariaDB (SLES)
  # Role AND distro intersection: only SLES DB hosts.
  hosts: "{{ target | default('role_db:&distro_sles') }}"
  gather_facts: true
  vars:
    # Root password from the single consolidated secret, resolved field-scoped
    # inline (see inventory/group_vars/all.yml note). Empty (default) skips the
    # root-password step.
    mysql_root_password: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).mysql_root_password | default('', true) }}
    mariadb_server_package: mariadb
    # SLES puts the MariaDB socket under /run/mysql. Override if your build differs.
    mariadb_socket: /run/mysql/mysql.sock
  tasks:
    - name: Skip non-SUSE hosts
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != "Suse"

    - name: Install the MariaDB server
      community.general.zypper:
        name: "{{ mariadb_server_package }}"
        state: present

    # PyMySQL for the interpreter Ansible actually uses here (python3.11 on
    # RHEL 8 and SLES 15, not /usr/bin/python3). See roles/pymysql_client.
    - name: Make PyMySQL importable for the ansible.mysql modules
      ansible.builtin.include_role:
        name: pymysql_client

    - name: Ensure mariadb is started and enabled at boot
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Set the MariaDB root password (switch root from unix_socket to password auth)
      ansible.mysql.mysql_user:
        column_case_sensitive: true   # the default; explicit so grants never get uppercased column names
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        # A fresh MariaDB root account uses the unix_socket plugin (the password
        # is ignored). Force mysql_native_password so the supplied password
        # actually authenticates.
        plugin: mysql_native_password
        login_unix_socket: "{{ mariadb_socket }}"
        # Idempotent across reruns: try the implicit socket admin first (before
        # the switch), then fall back to the password we just set.
        check_implicit_admin: true
        login_user: root
        login_password: "{{ mysql_root_password }}"
        state: present
      no_log: true
      when: mysql_root_password | length > 0
