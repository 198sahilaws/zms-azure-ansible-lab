---
# Catch the one domain-join credential mistake that is easy to make and slow
# to diagnose. Included by windows-domain-join.yml, windows-adc.yml and
# windows-rodc.yml after their "credentials present" asserts.
#
# THE COUPLING. Promoting the first DC (windows-adds.yml) turns that server's
# local accounts into domain accounts, passwords included, so the Windows
# admin account (winrm_username, zmsadmin by default) becomes ALCOR\zmsadmin
# with windows_admin_password, and windows-adds.yml then makes it a Domain
# Admin. If domain_join_username names that same account, domain_join_password
# must therefore equal windows_admin_password; otherwise every join and
# promotion is rejected, retried five times with a minute's delay each, and
# reported as a failed join rather than a wrong password.
#
# The plays avoid the coupling by default: with domain_join_username empty they
# use the admin account and its own password. This check covers the case where
# it is named explicitly. If you have deliberately changed that account's
# DOMAIN password since the forest was built, skip it with
#   -e domain_join_skip_password_check=true
#
# Expects these play vars: domain_join_user_secret,
# domain_join_password_secret, domain_admin_account,
# domain_admin_account_password.

- name: Compare the domain-join account with the Windows admin account
  ansible.builtin.set_fact:
    domain_join_password_mismatch: >-
      {{ domain_join_user_secret | length > 0
         and (domain_join_user_secret | regex_replace('^.*\\\\', '') | regex_replace('@.*$', '') | lower)
             == (domain_admin_account | lower)
         and domain_join_password_secret != domain_admin_account_password }}
  no_log: true

- name: Fail when the admin account is named with a different password
  ansible.builtin.fail:
    msg: >-
      domain_join_username names the Windows admin account '{{ domain_admin_account }}',
      but domain_join_password is not windows_admin_password. The forest root DC
      carried that account into the domain with windows_admin_password, so this
      join or promotion would be refused. Either leave domain_join_username and
      domain_join_password empty in secrets.auto.tfvars (the admin account is
      then used automatically), set domain_join_password to the same value as
      windows_admin_password, or name a different domain account. Then
      terraform apply to update the secret. If the account's domain password
      was changed on purpose, re-run with -e domain_join_skip_password_check=true.
  when:
    - domain_join_password_mismatch | bool
    - not (domain_join_skip_password_check | default(false) | bool)
