---
# Promote ADDITIONAL WRITABLE domain controllers (role_adc) into the EXISTING
# forest built by windows-adds.yml.
#
# WHY THIS PLAYBOOK EXISTS (and why "adc" is a separate role from "dc")
# windows-adds.yml runs microsoft.ad.domain, which CREATES a forest, against
# every host in role_dc. Tagging two instances Role=dc therefore does not give
# you two domain controllers — it gives you two hosts each trying to build
# alcor.co.in independently. A second writable DC has to be PROMOTED into the
# forest that already exists, which is what microsoft.ad.domain_controller does.
#
# This is the same shape as windows-rodc.yml, with read_only omitted (the module
# defaults to a writable DC) and no site pin.
#
# ORDER: after windows-adds.yml, before windows-rodc.yml — an RODC replicates
# from a writable DC, so having two of them first is the friendlier sequence.
#
#   ansible-playbook playbooks/windows-adc.yml
#   ansible-playbook playbooks/windows-adc.yml -e domain_dns_server=10.0.0.10
#   ansible-playbook playbooks/windows-adc.yml -e adc_no_log=false   # see real errors

- name: Promote additional writable domain controllers
  hosts: "{{ target | default('role_adc') }}"
  ignore_unreachable: true # a down/unsynced Windows host must not abort the converge
  gather_facts: true
  vars:
    ad_domain_name: alcor.co.in
    # Forest-root DC private IP, auto-discovered from the inventory (the role_dc
    # group; its inventory hostname IS the private IP).
    #
    # This MUST be set or the join fails with "The specified domain either does
    # not exist or could not be contacted": AD domain join resolves the domain via
    # SRV records (_ldap._tcp.dc._msdcs.<domain>) that ONLY the domain
    # controller's own DNS serves. Azure-provided DNS (168.63.129.16) does not
    # have them, and deployments/adds builds no Azure Private DNS zone at all
    # (one named alcor.co.in would shadow the DCs).
    # Override with -e domain_dns_server=<ip> if the DC is outside this inventory.
    domain_dns_server: "{{ (groups['role_dc'] | default([]) | first) | default('', true) }}"
    # Credentials from the consolidated secret, resolved field-scoped and inline.
    domain_admin_user: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).domain_join_username | default('', true) }}
    domain_admin_password: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).domain_join_password | default('', true) }}
    dsrm_password: >-
      {{ (lookup('zms_keyvault_secret', ansible_secret_name,
          vault_url=azure_keyvault_url, client_id=azure_client_id)
          | from_json).dsrm_password | default('', true) }}
  tasks:
    - name: Skip hosts that could not be reached (no facts gathered = unreachable)
      ansible.builtin.meta: end_host
      when: ansible_facts | length == 0

    - name: Assert domain-join and DSRM credentials are present
      ansible.builtin.assert:
        that:
          - domain_admin_user | length > 0
          - domain_admin_password | length > 0
          - dsrm_password | length > 0
        fail_msg: >-
          domain_join_username / domain_join_password / dsrm_password must be set
          in secrets.auto.tfvars (written to the consolidated secret) before promoting
          an additional domain controller.
      no_log: true

    - name: Fail early if no forest-root domain controller was discovered
      ansible.builtin.assert:
        that:
          - domain_dns_server | length > 0
        fail_msg: >-
          No host in the role_dc group, so the forest-root DC's DNS address is
          unknown and the domain join cannot resolve {{ ad_domain_name }}. Ensure
          windows_hosts has a host with role = "dc", or pass -e domain_dns_server=<ip>.

    - name: Point DNS at the forest-root domain controller
      ansible.windows.win_dns_client:
        adapter_names: '*'
        dns_servers:
          - "{{ domain_dns_server }}"

    - name: Flush the DNS resolver cache so the new server is used immediately
      ansible.windows.win_command: ipconfig /flushdns
      changed_when: false

    # The forest root may still be completing promotion (AD DS + DNS starting)
    # when this play runs, so wait for its LDAP port rather than failing outright.
    - name: Wait for the forest-root domain controller to serve LDAP
      ansible.windows.win_wait_for:
        host: "{{ domain_dns_server }}"
        port: 389
        timeout: 600
        state: started

    - name: Join the domain as a member (prerequisite for promotion)
      microsoft.ad.membership:
        dns_domain_name: "{{ ad_domain_name }}"
        domain_admin_user: "{{ domain_admin_user }}"
        domain_admin_password: "{{ domain_admin_password }}"
        state: domain
        reboot: true
      register: adc_join
      until: adc_join is succeeded
      retries: 5
      delay: 60
      no_log: "{{ adc_no_log | default(true) | bool }}"

    # The join reboots the host. Promotion must not start until it is fully back
    # and the domain secure channel is usable, or DCPromo fails part-way.
    # NOTE: use ansible.builtin.wait_for_connection — there is NO
    # ansible.windows.win_wait_for_connection module. The builtin one is
    # connection-plugin aware and works over WinRM.
    - name: Wait for the host to come back after the domain-join reboot
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 10

    - name: Settle before promotion (netlogon / secure channel)
      ansible.builtin.pause:
        seconds: 30

    - name: Promote to an additional writable domain controller
      microsoft.ad.domain_controller:
        dns_domain_name: "{{ ad_domain_name }}"
        domain_admin_user: "{{ domain_admin_user }}"
        domain_admin_password: "{{ domain_admin_password }}"
        safe_mode_password: "{{ dsrm_password }}"
        # read_only is deliberately NOT set: the module defaults to a writable
        # DC, which is the whole point of this playbook. Do not copy the
        # read_only/site_name pair from windows-rodc.yml.
        install_dns: true
        state: domain_controller
        reboot: true
      register: adc_promote
      until: adc_promote is succeeded
      retries: 3
      delay: 60
      # Credentials are redacted by default. To SEE the real DCPromo error when
      # debugging, re-run with:  -e adc_no_log=false
      no_log: "{{ adc_no_log | default(true) | bool }}"

    - name: Forward non-AD DNS queries to Azure DNS
      ansible.builtin.include_tasks: tasks/azure-dns-forwarder.yml
