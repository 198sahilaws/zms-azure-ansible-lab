[defaults]
inventory            = inventory/azure_rm.yml
roles_path           = roles
# zms_keyvault_secret (the Key Vault lookup every play uses) lives here; see
# the header of lookup_plugins/zms_keyvault_secret.py for why.
lookup_plugins       = lookup_plugins
collections_path     = collections
# Ephemeral cloud hosts churn keys (a rebuilt VM reuses its private IP with a
# new host key).
host_key_checking    = False
retry_files_enabled  = False
# Ample for a few-dozen-host estate.
forks                = 20
interpreter_python   = auto_silent
# The old community.general 'yaml' stdout callback is removed on recent
# ansible-core; use the built-in default callback with YAML result formatting.
stdout_callback      = ansible.builtin.default
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks
fact_caching         = jsonfile
fact_caching_connection = /var/tmp/ansible_facts
fact_caching_timeout = 3600
# Persistent run log (in addition to journald). Every ansible-playbook run is
# appended here; the dir is created by the control node's cloud-init.
log_path                = /var/log/ansible/ansible.log

[inventory]
# The azure_rm plugin only accepts a file whose name ends in azure_rm.yml.
# host_list/yaml stay enabled so `-i 10.191.10.4,` and static test inventories
# still work for ad-hoc runs.
enable_plugins = azure.azcollection.azure_rm, host_list, yaml

[connection]
# NOTE: pipelining must live under [connection] (or [defaults]); ansible-core
# 2.16+ no longer reads it from [ssh_connection]. Biggest Linux push speedup;
# requires requiretty OFF in the managed hosts' sudoers (default on cloud images).
pipelining    = True

[ssh_connection]
ssh_args      = -o ControlMaster=auto -o ControlPersist=60s
control_path  = /tmp/ansible-%%r@%%h:%%p

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
