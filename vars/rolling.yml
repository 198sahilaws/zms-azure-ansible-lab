---
# Rolling-batch arithmetic for site.yml's baseline plays. Loaded with
# vars_files; the play sets `rolling_group` (the inventory group it targets).
#
# THE RULE: one failing host never stops the baseline on the others. Two or
# more failures in a batch are still bigger than max_fail_pct allows, and the
# play stops, as before.
#
# Why the old `serial: "{{ rolling_batch }}"` / `max_fail_percentage:
# "{{ max_fail_pct }}"` could not keep that rule on a lab-sized estate:
#   - serial "50%" rounds DOWN (ansible's pct_to_int): 5 hosts -> 2, 2, 1.
#   - max_fail_percentage aborts when failed / batch > pct, and then marks
#     every remaining host failed. With batches of 2 and pct 20, one failed
#     host is 50% and ends the play for everyone, including later batches.
#   - a batch of 1 that fails is "the whole batch failed", which also ends
#     the play.
#
# What this computes instead (n = hosts in rolling_group this run, after --limit):
#   rolling_size     batch size from rolling_batch ("50%" or a count),
#                    rounded UP, at least 2 when n >= 2
#   rolling_serial   ceil(n / size) batches, split as evenly as possible and
#                    never smaller than 2 hosts: 5 hosts at 50% -> [3, 2],
#                    not [2, 2, 1]; 3 hosts -> [3], not [2, 1]
#   rolling_max_fail max(max_fail_pct, ceil(100 / smallest batch)): exactly
#                    enough for one failure in the smallest batch to stay
#                    under the threshold. Large estates are unaffected: nine
#                    hosts at 50% are [5, 4], 25 vs 20 asked; ten are [5, 5],
#                    exactly 20.
#
# Unreachable hosts do not count toward max_fail_percentage in ansible; they
# count only toward "the whole batch failed".

# The hosts this run will actually touch: the group narrowed by --limit
# (ansible_play_hosts_all), so a limited run gets batches sized for itself.
rolling_n: >-
  {{ groups[rolling_group] | default([])
     | intersect(ansible_play_hosts_all | default(groups[rolling_group] | default([])))
     | length }}

rolling_size: >-
  {%- set n = rolling_n | int -%}
  {%- set rb = rolling_batch | default('100%') | string | trim -%}
  {%- if rb.endswith('%') -%}
  {%-   set b = (n * (rb[:-1] | float) / 100) | round(0, 'ceil') | int -%}
  {%- else -%}
  {%-   set b = rb | int -%}
  {%- endif -%}
  {{ [[b, [n, 2] | min, 1] | max, [n, 1] | max] | min }}

rolling_serial: >-
  {%- set n = rolling_n | int -%}
  {%- set b = rolling_size | int -%}
  {%- set k = ((n / b) | round(0, 'ceil') | int) if n > 0 else 1 -%}
  {%- set k = [k, [n // 2, 1] | max] | min -%}
  {%- set base = (n // k) if n > 0 else 1 -%}
  {%- set extra = (n % k) if n > 0 else 0 -%}
  {{ ([base + 1] * extra + [base] * (k - extra)) | join(',') }}

rolling_smallest: >-
  {{ rolling_serial | split(',') | map('int') | min }}

rolling_max_fail: >-
  {{ [max_fail_pct | default(0) | int,
      (100 / (rolling_smallest | int)) | round(0, 'ceil') | int] | max }}
