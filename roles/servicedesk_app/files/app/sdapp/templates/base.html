<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2024; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2f5fd0;
    --p1: #b42318; --p2: #c4620a; --p3: #2f5fd0; --p4: #667085;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181c; --card:#1e2227; --ink:#e6e8ea; --muted:#98a2b3;
            --line:#2c3138; --accent:#7aa2f7; --p3:#7aa2f7; --p4:#98a2b3; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header h1 a { color:inherit; text-decoration:none; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .tiles { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:12px 16px; min-width:110px; }
  .tile .n { font-size:22px; font-weight:600; }
  .tile .l { color:var(--muted); font-size:12px; text-transform:uppercase;
             letter-spacing:.04em; }
  nav.filters { margin-bottom:14px; display:flex; gap:8px; flex-wrap:wrap; }
  nav.filters a { padding:5px 10px; border:1px solid var(--line); border-radius:999px;
                  background:var(--card); color:var(--muted); text-decoration:none; font-size:13px; }
  nav.filters a.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line);
          border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:760px; }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  td a { color:var(--accent); text-decoration:none; }
  .pri { font-weight:700; font-size:12px; }
  .P1{color:var(--p1)} .P2{color:var(--p2)} .P3{color:var(--p3)} .P4{color:var(--p4)}
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px;
           border:1px solid var(--line); color:var(--muted); }
  .muted { color:var(--muted); }
  .sla { font-size:12px; font-weight:600; }
  .sla.breached { color:var(--p1); }
  .sla.at_risk  { color:var(--p2); }
  .sla.on_track { color:var(--muted); font-weight:400; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:16px 18px; margin-bottom:12px; }
  .comment { border-left:3px solid var(--line); padding:2px 0 2px 14px; margin:14px 0; }
  .comment.internal { border-left-color:var(--p2); }
  .comment .meta { color:var(--muted); font-size:12px; margin-bottom:3px; }
  footer { color:var(--muted); font-size:12px; padding:10px 20px 30px; text-align:center; }
</style>
</head>
<body>
<header><h1><a href="{{ url_for('index') }}">{{ app_name }}</a></h1></header>
<main>{% block content %}{% endblock %}</main>
<footer>ZMS Azure Lab · three tiers, three hosts · this page came from the web host,
its data from the middleware host over HTTP, and that from the MySQL host — a
fresh connection on every request</footer>
</body>
</html>
