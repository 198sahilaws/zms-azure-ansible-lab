---
# Collections required on the control node.
# Install with: ansible-galaxy collection install -r requirements.yml
#
# Every collection is PINNED to an exact version: the versions that loaded on a
# working control node on 2026-11-27 (ansible-core 2.21.5). Ranges let the
# 30-minute refresh upgrade a running lab on a release day, which is how
# azure.azcollection 4.3.0 broke the inventory. To move a collection on: change
# its pin, push, and check the next refresh on a lab before relying on it.
#
# THE CONTROL NODE HAS TWO COLLECTION TREES. Know which one wins.
#
# The `ansible` PPA package installs the whole community bundle into
#   /usr/lib/python3/dist-packages/ansible_collections
# and ships versions NEWER than several caps here — observed on a live node:
# community.mysql 5.0.2 (since replaced by ansible.mysql), community.general
# 13.4.0 (cap <12) on the AWS node; the same PPA bundle also carries
# azure.azcollection 3.x. ansible.cfg sets
#   collections_path = collections
# so at RUNTIME /opt/control-repo/collections is searched first and the pinned
# versions win. That is the intended behaviour and it is what actually happens.
#
# The trap is that `ansible-galaxy install` resolves "already installed" against
# a WIDER set of paths than runtime searches. A collection the PPA already ships
# at the pinned version is skipped rather than placed in the repo tree; on the
# 2026-11-27 node ansible.posix, microsoft.ad, community.windows and
# chocolatey.chocolatey load from the PPA tree for that reason. That is harmless
# while the versions match. With exact pins, a PPA copy at any OTHER version no
# longer satisfies the pin, so galaxy installs the pinned one into the repo tree,
# which wins at runtime: the pins hold either way. The one gap left: a pin that
# equals the PPA's version while the repo tree still holds an older copy of the
# same collection. Galaxy skips it, and runtime loads the older repo copy.
#
# So: after changing a pin, verify it took effect on the node rather than
# assuming, with
#   cd /opt/control-repo && ansible-galaxy collection list <name>
# and check which directory heading the version is printed under (the repo
# tree, /opt/control-repo/collections, is listed first and wins).
collections:
  # azure_rm inventory. Replaces amazon.aws. Secrets are read by the repo's own
  # lookup_plugins/zms_keyvault_secret.py, which falls back to this collection's
  # azure_keyvault_secret only off Azure (workstation, az login).
  #
  # Unlike amazon.aws it needs a large Python SDK set (its requirements.txt) in
  # the interpreter that runs ansible-playbook. The PPA bundle usually already
  # ships a satisfying version, so galaxy skips it and the copy that loads is the
  # one in /usr/lib/python3/dist-packages — which is why scripts/reconverge.sh
  # finds the requirements file wherever the collection actually lives instead
  # of assuming the repo tree, and reinstalls it when an import check fails or
  # the file has changed since the last install.
  #
  # PINNED to an exact version. A range let the 30-minute refresh pull 4.3.0 on
  # its release day; it needs SDK packages the node did not have, and the
  # inventory broke ("name 'managed_identity' is not defined"). To move to a new
  # version: change the pin, push, and check `ansible-inventory --graph` on the
  # control node after the next refresh. reconverge.sh reinstalls the matching
  # SDK set whenever the collection's requirements.txt changes, and galaxy
  # replaces an installed copy of a different version, downgrades included.
  - name: azure.azcollection
    version: "==4.2.0"
  - name: ansible.windows       # win_* core modules
    version: "==3.9.2"
  - name: microsoft.ad          # AD DS forest/domain promotion (windows-adds)
    version: "==1.12.1"
  - name: community.windows     # extended Windows modules
    version: "==3.3.0"
  - name: chocolatey.chocolatey
    version: "==1.6.0"
  - name: community.general
    version: "==11.4.10"
  # MySQL/MariaDB modules (ubuntu-mysql, rhel/sles-mariadb, servicedesk_db).
  # community.mysql is retired: 4.3 deprecates every module,
  # 5.x ships none (only redirects here), and 3.x imports
  # ansible.module_utils._text, which ansible-core removes in 2.24. The
  # modules moved to ansible.mysql unchanged; the repo calls them by their
  # ansible.mysql.* names. Its one breaking change (mysql_user lost the `user`
  # alias) does not apply: every task uses `name`.
  - name: ansible.mysql
    version: "==5.2.1"
  - name: ansible.posix        # profile_tasks callback (task timing in output)
    version: "==2.2.2"
